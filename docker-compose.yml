services:
  # Default PostgreSQL instance (docker compose up -d database)
  database:
    image: postgres:16
    container_name: clean-arch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APP_POSTGRES_DB:-app}
      POSTGRES_USER: ${APP_POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:-app}
    ports:
      - "${APP_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_POSTGRES_USER:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - clean_arch

  # Optional MySQL instance (docker compose --profile mysql up -d mysql)
  mysql:
    image: mysql:8.2
    container_name: clean-arch-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${APP_MYSQL_DB:-app}
      MYSQL_USER: ${APP_MYSQL_USER:-app}
      MYSQL_PASSWORD: ${APP_MYSQL_PASSWORD:-app}
      MYSQL_ROOT_PASSWORD: ${APP_MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${APP_MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - clean_arch
    profiles:
      - mysql

  # Optional MongoDB instance (docker compose --profile mongo up -d mongo)
  mongo:
    image: mongo:7
    container_name: clean-arch-mongo
    restart: unless-stopped
    ports:
      - "${APP_MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${APP_MONGO_DATABASE:-app}
      MONGO_INITDB_ROOT_USERNAME: ${APP_MONGO_USER:-app}
      MONGO_INITDB_ROOT_PASSWORD: ${APP_MONGO_PASSWORD:-app}
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongo-data:/data/db
    networks:
      - clean_arch
    profiles:
      - mongo

  # Keycloak OIDC provider (docker compose --profile keycloak up -d keycloak)
  # Dev mode: H2 store, no data volume, so `down` gives a clean slate and the realm
  # below is re-imported on every recreate. Startup import SKIPS an existing realm.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: clean-arch-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      # 26.x names. KEYCLOAK_ADMIN/_PASSWORD are deprecated and leave you with no admin.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # The `iss` claim is built from this. It must match APP_OIDC_ISSUER_URL's origin
      # byte-for-byte or go-oidc rejects the ID token with an issuer mismatch.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # Health is on the management port 9000, not 8080, and the image ships no curl
      # or wget. This is Keycloak's own documented /dev/tcp probe. Keep it a
      # single-quoted YAML scalar: a double-quoted one turns \r\n into real control
      # characters before bash sees them and the request goes out malformed.
      test:
        - CMD-SHELL
        - '{ printf "HEAD /health/ready HTTP/1.0\r\n\r\n" >&0; grep "HTTP/1.0 200"; } 0<>/dev/tcp/localhost/9000'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - clean_arch
    profiles:
      - keycloak

  # Migration helper (docker compose --profile migrate run --rm migrator)
  migrator:
    image: migrate/migrate:v4.17.1
    container_name: clean-arch-migrator
    entrypoint: ["/bin/sh", "-c"]
    # List form with ONE element: string form would be word-split into argv and
    # `sh -c` would run only the first token.
    command:
      - "${MIGRATION_CMD:-echo Set MIGRATION_CMD to run migrations}"
    volumes:
      - ./db/migrations:/migrations
    networks:
      - clean_arch
    depends_on:
      database:
        condition: service_healthy
    profiles:
      - migrate

networks:
  clean_arch:
    driver: bridge

volumes:
  postgres-data:
  mysql-data:
  mongo-data:
